<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Solar</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header>
    <h1>Calculadora Solar</h1>
    <p>Descubra quantos painéis solares você precisa para cubrir a sua conta de luz!</p>
  </header>
  <main>
    <form>
      <label for="valor-conta">Valor da conta (R$) </label>
      <input type="number" name="valor-conta" id="valor-conta">
      <label for="estado">Estado</label>
      <select name="estado" id="estado" required>
        <option value="am">AM</option>
        <option value="sp">SP</option>
        <option value="rj">RJ</option>
      </select>
      <button id="botao-calcular">Calcular</button>
    </form>
    <section id="sessao-resultados">
      <h1>Resultado</h1>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
