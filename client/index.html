<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Solar</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header>
    <h1>Calculadora Solar</h1>
    <p>Descubra quantos painéis solares você precisa para cubrir a sua conta de luz!</p>
  </header>
  <main>
    <form>
      <label for="valor-conta">Valor da conta (R$) </label>
      <input type="text" name="valor-conta" id="valor-conta" placeholder="0,00" required>
      <fieldset id="localidade"></fieldset>
      <button id="botao-calcular" disabled>Calcular</button>
    </form>
    <section id="sessao-resultados" hidden>
      <h1>Resultado</h1>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
